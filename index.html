<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICEEMPEROR — Projects</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #0a0c0a; color: #cfd8cf; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    padding: 40px 20px;
  }
  h1 { font-size: 28px; letter-spacing: 8px; color: #dfe8df; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #6f7f6f; margin-bottom: 36px; }
  .grid { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; max-width: 900px; }
  a.card {
    display: block; width: 260px; text-decoration: none; color: inherit;
    background: rgba(20, 28, 20, 0.85); border: 1px solid rgba(255,255,255,0.14); border-radius: 8px;
    overflow: hidden; transition: transform 0.15s, border-color 0.15s;
  }
  a.card:hover { transform: translateY(-3px); border-color: #6f8f5f; }
  .card img { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; background: #1a221a; }
  .card .body { padding: 12px 14px; }
  .card h2 { font-size: 16px; color: #dfe8df; letter-spacing: 2px; margin-bottom: 4px; }
  .card p { font-size: 12px; color: #93a393; line-height: 1.6; }
</style>
</head>
<body>
  <h1>ICEEMPEROR</h1>
  <div class="sub">projects</div>
  <div class="grid">
    <a class="card" href="./exshoot/">
      <img src="./exshoot/cover.png" alt="EXSHOOT">
      <div class="body">
        <h2>EXSHOOT</h2>
        <p>Three.js 익스트랙션 슈터 — 루팅·교전·탈출. 데스크톱/모바일 지원.</p>
      </div>
    </a>
  </div>
</body>
</html>
